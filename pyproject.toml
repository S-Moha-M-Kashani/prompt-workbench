[project]
name = "prompt-workbench"
version = "0.3.0"
description = "Streamlit workspace for engineering, testing, and evaluating system prompts"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Moha Kashani", email = "s.moha.m.kashani@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "openai>=2.44.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "streamlit>=1.40",
]

[project.optional-dependencies]
# The metric layer. Kept optional because it costs ~31 transitive packages,
# including telemetry, and the rest of the workbench works without it.
deepeval = ["deepeval>=4.0,<5"]
# Framework adapters. Each extra disables only itself when absent: the registry
# decides availability at call time and names the install command.
langchain = ["langchain>=1.1,<2", "langchain-openai>=1.0,<2"]
langgraph = ["langgraph>=1.0,<2", "langchain-openai>=1.0,<2"]
# Reaches a different provider with its own credential and its own prices, so
# its models are presented as a separate catalogue rather than merged in.
anthropic = ["anthropic>=0.116"]

[project.scripts]
prompt-workbench = "prompt_workbench.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_workbench"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
disallow_untyped_defs = true

# deepeval is an optional extra and ships no stubs. Its absence is a supported
# state, so type-checking must pass with or without it installed.
[[tool.mypy.overrides]]
module = [
    "deepeval.*",
    "langchain.*",
    "langchain_core.*",
    "langchain_openai.*",
    "langgraph.*",
    "anthropic.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live tests spend real money against a real provider. They guard
# themselves with PROMPT_WORKBENCH_LIVE, so a plain `uv run pytest` collects
# them and skips every one. They are skipped rather than deselected so an
# editor's test list still shows them — all named `test_live_*`:
#     PROMPT_WORKBENCH_LIVE=1 uv run pytest -m live
markers = [
    "live: makes a real provider call. Costs money. Skipped unless PROMPT_WORKBENCH_LIVE=1.",
]
