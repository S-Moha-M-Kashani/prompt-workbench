[project]
name = "prompt-workbench"
version = "1.0.0"
description = "Streamlit workspace for engineering, testing, and evaluating system prompts"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Moha Kashani", email = "s.moha.m.kashani@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "openai>=2.44.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "streamlit>=1.40",
]

[project.scripts]
prompt-workbench = "prompt_workbench.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_workbench"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
disallow_untyped_defs = true
