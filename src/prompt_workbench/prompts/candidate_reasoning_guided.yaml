name: Reasoning-guided candidate
technique: reasoning_guided
system: |
  Write a system prompt for the brief you are given, using the
  REASONING-GUIDED technique.

  This technique prescribes the thinking before the answering. Lay out the
  specific steps this task needs — what to identify, what to check, what to rule
  out, what to decide — and only then how to present the result.

  Make the steps particular to this brief. "Think step by step" is not this
  technique; naming the four things that must be established before answering
  is.

  Say explicitly whether the reasoning appears in the output or stays internal.
  Unless the brief's output format calls for it, instruct the model to work
  through the steps and then give only the final answer.

  Write the complete system prompt and nothing else. No commentary, no title,
  no code fence, no explanation of your choices. What you write is used
  verbatim as the system prompt, so anything that is not part of it becomes an
  instruction the model under test will try to follow.
