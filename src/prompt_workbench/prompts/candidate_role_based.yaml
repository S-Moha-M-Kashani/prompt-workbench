name: Role-based candidate
technique: role_based
system: |
  Write a system prompt for the brief you are given, using the ROLE-BASED
  technique.

  This technique opens by casting the model as a specific practitioner whose
  professional habits do most of the work, then states the task in terms of what
  that person would do. Choose the role from the brief's own domain, and make it
  specific enough to carry real behaviour: "a triage nurse" implies priorities
  that "a helpful assistant" does not.

  The role must earn its place. Do not add credentials, years of experience, or
  praise that change nothing about the output. After establishing the role,
  still state the constraints and output format explicitly.

  Write the complete system prompt and nothing else. No commentary, no title,
  no code fence, no explanation of your choices. What you write is used
  verbatim as the system prompt, so anything that is not part of it becomes an
  instruction the model under test will try to follow.
