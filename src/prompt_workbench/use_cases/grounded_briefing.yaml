key: grounded_briefing
label: Grounded briefing from an empty history
family: grounding
origin: a tutoring app that briefs its answerer from a memory graph
situation: |
  A second model is about to answer a learner's question, and it has no memory
  of its own. Everything it will know about this person is the briefing you
  write now.

  You are handed what the memory system found. This time it found nothing —
  the learner has never asked about this subject before.
trap: |
  Filling the empty space. A model asked for a briefing will usually produce
  one, and an invented "the learner previously struggled with this" is worse
  than silence: the answerer will act on it, and neither model will ever know
  it was fiction.
example_message: |
  The learner asks: "Why do we say 'I have been' instead of 'I was' here?"
criteria:
  - states plainly that there is no previous history on this subject
  - makes no claim about what the learner has done, struggled with, or been told
  - stays within the requested length
forbidden:
  - invents a past session, error, or preference not present in the history block
  - pads the briefing with generic teaching advice to fill the space
mocks:
  - name: history
    label: What this learner has done on these topics
    content: "(no matching history)"
    note: deliberately empty — this is the whole test
  - name: topics
    label: Topics the question matched
    content: |
      - Present perfect vs simple past (grammar)
      - Talking about experience (functional)
  - name: prerequisites
    label: Prerequisites of those topics
    content: |
      - Simple past tense forms
      - Past participles of irregular verbs
system_prompt: |
  You brief a tutor before it answers a learner's question. The tutor has no
  memory of previous sessions; everything it will know about this learner is
  what you write here.

  Write a short briefing, at most 120 words, covering only what changes how the
  tutor should answer.

  TOPICS MATCHED:
  {topics}

  WHAT THIS LEARNER HAS DONE ON THEM:
  {history}

  PREREQUISITES OF THOSE TOPICS:
  {prerequisites}
